<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Combien tu me connais ?</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5B3FA0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --white: #FFFFFF;
    --mist: #F8F6FC;
    --lilac: #E9E1F8;
    --lilac-deep: #D2C2F0;
    --violet: #8B6FD6;
    --violet-deep: #5B3FA0;
    --ink: #17151C;
    --grey: #75717E;
    --line: rgba(23,21,28,0.08);
    --green: #34A853;
    --red: #D64545;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--white);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }

  .display {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }

  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--violet-deep);
    outline-offset: 3px;
  }

  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.45;
    z-index: 0;
  }
  .orb-a { width: 480px; height: 480px; top: -160px; left: -120px; background: radial-gradient(circle, var(--lilac-deep), transparent 70%); }
  .orb-b { width: 420px; height: 420px; bottom: -160px; right: -120px; background: radial-gradient(circle, var(--violet), transparent 70%); opacity: 0.3; }

  .back-link {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    font-size: 0.85rem;
    color: var(--grey);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
  }
  .back-link:hover { color: var(--violet-deep); }

  .quiz-card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 32px;
    box-shadow: 0 30px 70px rgba(91,63,160,0.16);
    padding: clamp(28px, 6vw, 52px);
  }

  /* ---------- ÉCRAN DE DÉPART ---------- */
  .start-screen { text-align: center; }
  .start-screen .kicker {
    font-size: 0.78rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--violet);
    display: block;
    margin-bottom: 16px;
  }
  .start-screen h1 {
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    margin-bottom: 16px;
  }
  .start-screen p {
    color: var(--grey);
    line-height: 1.6;
    margin-bottom: 32px;
    max-width: 40ch;
    margin-left: auto;
    margin-right: auto;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 15px 32px;
    border-radius: 999px;
    border: none;
    background: var(--violet-deep);
    color: #fff;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.3s ease, transform 0.3s ease;
  }
  .btn-primary:hover { background: var(--violet); transform: translateY(-2px); }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 13px 26px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--white);
    color: var(--ink);
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 600;
    font-size: 0.92rem;
    cursor: pointer;
    transition: border-color 0.3s ease, background 0.3s ease;
  }
  .btn-secondary:hover { background: var(--mist); border-color: var(--lilac-deep); }

  /* ---------- ÉCRAN QUESTION ---------- */
  .quiz-progress {
    display: flex;
    gap: 6px;
    margin-bottom: 28px;
  }
  .quiz-progress .dot {
    flex: 1;
    height: 5px;
    border-radius: 999px;
    background: var(--lilac);
    overflow: hidden;
  }
  .quiz-progress .dot span {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--violet-deep);
    transition: width 0.4s ease;
  }
  .quiz-progress .dot.done span { width: 100%; }
  .quiz-progress .dot.current span { width: 100%; }

  .quiz-counter {
    font-size: 0.8rem;
    color: var(--grey);
    margin-bottom: 10px;
  }

  .quiz-question {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 600;
    font-size: clamp(1.25rem, 4vw, 1.6rem);
    line-height: 1.35;
    margin-bottom: 26px;
  }

  .quiz-options {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 8px;
  }

  .quiz-option {
    text-align: left;
    padding: 15px 18px;
    border-radius: 16px;
    border: 1.5px solid var(--line);
    background: var(--white);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 0.98rem;
    cursor: pointer;
    transition: border-color 0.25s ease, background 0.25s ease, transform 0.15s ease;
  }
  .quiz-option:hover:not(:disabled) { border-color: var(--violet); background: var(--mist); }
  .quiz-option:disabled { cursor: default; }

  .quiz-option.correct {
    border-color: var(--green);
    background: rgba(52,168,83,0.1);
    color: #1c6b34;
  }
  .quiz-option.wrong {
    border-color: var(--red);
    background: rgba(214,69,69,0.08);
    color: #9c2b2b;
  }

  .quiz-next-wrap { margin-top: 24px; text-align: right; min-height: 44px; }

  /* ---------- ÉCRAN RÉSULTAT ---------- */
  .result-screen { text-align: center; }
  .result-emoji { font-size: 3rem; margin-bottom: 12px; }
  .result-score {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: clamp(2.4rem, 8vw, 3.6rem);
    background: linear-gradient(100deg, var(--violet-deep), var(--violet));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 10px;
  }
  .result-message {
    color: var(--grey);
    line-height: 1.6;
    margin-bottom: 30px;
    max-width: 38ch;
    margin-left: auto;
    margin-right: auto;
  }
  .result-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  .hidden { display: none !important; }

  .fade-in { animation: fadeIn 0.5s cubic-bezier(.16,1,.3,1); }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <div class="orb orb-a" aria-hidden="true"></div>
  <div class="orb orb-b" aria-hidden="true"></div>

  <a class="back-link" href="index.html">← Retour au site</a>

  <div class="quiz-card">

    <!-- ÉCRAN DE DÉPART -->
    <div class="start-screen" id="start-screen">
      <span class="kicker">Petit défi</span>
      <h1 class="display">Combien tu me connais ?</h1>
      <p>Quelques questions sur nous pour voir si tu suis vraiment. Prête ?</p>
      <button type="button" class="btn-primary" id="start-btn">Commencer le quiz</button>
    </div>

    <!-- ÉCRAN QUESTION -->
    <div class="hidden" id="question-screen">
      <div class="quiz-progress" id="quiz-progress"></div>
      <p class="quiz-counter" id="quiz-counter"></p>
      <p class="quiz-question" id="quiz-question"></p>
      <div class="quiz-options" id="quiz-options"></div>
      <div class="quiz-next-wrap" id="quiz-next-wrap"></div>
    </div>

    <!-- ÉCRAN RÉSULTAT -->
    <div class="hidden result-screen" id="result-screen">
      <div class="result-emoji" id="result-emoji">🎉</div>
      <p class="result-score" id="result-score"></p>
      <p class="result-message" id="result-message"></p>
      <div class="result-actions">
        <button type="button" class="btn-secondary" id="retry-btn">Recommencer</button>
        <a class="btn-primary" href="index.html">Retour au site</a>
      </div>
    </div>

  </div>

  <script type="module">
    // ============ QUIZ — À PERSONNALISER PAR TOI ============
    // Modifie librement les questions, options et bonnes réponses (index 0 à 3).
    const QUIZ = [
      {
        question: "Quel est mon signe astrologique ?",
        options: ["Lion", "Bélier", "Balance", "Scorpion"],
        correct: 1
      },
      {
        question: "Ma voiture de rêve ?",
        options: ["Porsche 911", "BMW M4", "Audi R8", "Mercedes AMG GT"],
        correct: 2
      },
      {
        question: "Mon cocktail préféré ?",
        options: ["Mojito", "Piña Colada", "Margarita", "Spritz"],
        correct: 0
      },
      {
        question: "Ma marque de vêtements favorite ?",
        options: ["Nike", "Levi's", "Zara", "Carhartt"],
        correct: 3
      },
      {
        question: "Quelle est ma pointure de pied ?",
        options: ["40", "41", "42", "43"],
        correct: 2
      }
    ];

    // ============ OPTIONNEL : enregistrer le score sur Firebase ============
    // Réutilise la même config que le site principal pour que tu voies son score.
    // Laisse tel quel si tu as déjà configuré Firebase sur le site, sinon les
    // scores ne seront simplement pas sauvegardés (le quiz fonctionne quand même).
    let saveScoreFn = null;
    (async () => {
      try {
        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
        const { getFirestore, collection, addDoc, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
        const firebaseConfig = {
          apiKey: "AIzaSyD0oUm5g-GHkTe0tccQegRYlSX6G7r0eTc",
          authDomain: "for2-ccf8b.firebaseapp.com",
          projectId: "for2-ccf8b",
          storageBucket: "for2-ccf8b.firebasestorage.app",
          messagingSenderId: "1047465407778",
          appId: "1:1047465407778:web:9291164ff3d52b1a36a17b",
          measurementId: "G-XCGLVF21YF"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const resultsCollection = collection(db, "quizResults");
        saveScoreFn = (score, total) =>
          addDoc(resultsCollection, { score, total, createdAt: serverTimestamp() }).catch(() => {});
      } catch (err) {
        console.error("Firebase indisponible pour le quiz (le quiz reste jouable) :", err);
      }
    })();

    // ============ LOGIQUE DU QUIZ ============
    const startScreen = document.getElementById('start-screen');
    const questionScreen = document.getElementById('question-screen');
    const resultScreen = document.getElementById('result-screen');
    const startBtn = document.getElementById('start-btn');
    const retryBtn = document.getElementById('retry-btn');
    const progressEl = document.getElementById('quiz-progress');
    const counterEl = document.getElementById('quiz-counter');
    const questionEl = document.getElementById('quiz-question');
    const optionsEl = document.getElementById('quiz-options');
    const nextWrapEl = document.getElementById('quiz-next-wrap');
    const resultEmoji = document.getElementById('result-emoji');
    const resultScore = document.getElementById('result-score');
    const resultMessage = document.getElementById('result-message');

    let currentIndex = 0;
    let score = 0;
    let answered = false;

    function buildProgress() {
      progressEl.innerHTML = '';
      QUIZ.forEach(() => {
        const dot = document.createElement('div');
        dot.className = 'dot';
        dot.innerHTML = '<span></span>';
        progressEl.appendChild(dot);
      });
    }

    function updateProgress() {
      const dots = progressEl.children;
      for (let i = 0; i < dots.length; i++) {
        dots[i].classList.toggle('done', i < currentIndex);
        dots[i].classList.toggle('current', i === currentIndex);
      }
    }

    function renderQuestion() {
      answered = false;
      const q = QUIZ[currentIndex];
      counterEl.textContent = `Question ${currentIndex + 1} sur ${QUIZ.length}`;
      questionEl.textContent = q.question;
      questionEl.classList.add('fade-in');
      optionsEl.innerHTML = '';
      nextWrapEl.innerHTML = '';
      updateProgress();

      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'quiz-option';
        btn.textContent = opt;
        btn.addEventListener('click', () => selectAnswer(i, btn));
        optionsEl.appendChild(btn);
      });
    }

    function selectAnswer(index, btn) {
      if (answered) return;
      answered = true;
      const q = QUIZ[currentIndex];
      const allBtns = optionsEl.querySelectorAll('.quiz-option');
      allBtns.forEach(b => b.disabled = true);

      if (index === q.correct) {
        score++;
        btn.classList.add('correct');
      } else {
        btn.classList.add('wrong');
        allBtns[q.correct].classList.add('correct');
      }

      const nextBtn = document.createElement('button');
      nextBtn.type = 'button';
      nextBtn.className = 'btn-primary';
      nextBtn.textContent = currentIndex < QUIZ.length - 1 ? 'Suivant →' : 'Voir le résultat';
      nextBtn.addEventListener('click', goNext);
      nextWrapEl.appendChild(nextBtn);
    }

    function goNext() {
      currentIndex++;
      if (currentIndex < QUIZ.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      questionScreen.classList.add('hidden');
      resultScreen.classList.remove('hidden');
      resultScreen.classList.add('fade-in');

      const total = QUIZ.length;
      const pct = total > 0 ? score / total : 0;
      resultScore.textContent = `${score} / ${total}`;

      if (pct === 1) {
        resultEmoji.textContent = '🏆';
        resultMessage.textContent = "Score parfait. Tu me connais par cœur.";
      } else if (pct >= 0.7) {
        resultEmoji.textContent = '💜';
        resultMessage.textContent = "Très bon score, tu es attentive !";
      } else if (pct >= 0.4) {
        resultEmoji.textContent = '😄';
        resultMessage.textContent = "Pas mal, mais on a encore des choses à découvrir l'un sur l'autre.";
      } else {
        resultEmoji.textContent = '🙈';
        resultMessage.textContent = "Bon... on a du rattrapage à faire !";
      }

      if (saveScoreFn) saveScoreFn(score, total);
    }

    function startQuiz() {
      currentIndex = 0;
      score = 0;
      startScreen.classList.add('hidden');
      resultScreen.classList.add('hidden');
      questionScreen.classList.remove('hidden');
      buildProgress();
      renderQuestion();
    }

    startBtn.addEventListener('click', startQuiz);
    retryBtn.addEventListener('click', startQuiz);
  </script>

</body>
</html>
