<html lang="fr">
<head>

<title>Montpellier — Carte aux 100 lieux</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5B3FA0">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --white: #FFFFFF;
    --mist: #F8F6FC;
    --lilac: #E9E1F8;
    --lilac-deep: #D2C2F0;
    --violet: #8B6FD6;
    --violet-deep: #5B3FA0;
    --ink: #17151C;
    --grey: #75717E;
    --line: rgba(23,21,28,0.08);
    --locked: #C9C4D6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--white);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 70px 20px 90px;
  }
  .display { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; letter-spacing: -0.02em; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--violet-deep); outline-offset: 3px; }

  .back-link {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 500;
    font-size: 0.85rem;
    color: var(--grey);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
  }
  .back-link:hover { color: var(--violet-deep); }

  .page-header { max-width: 720px; margin: 0 auto 24px; text-align: center; }
  .kicker {
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--violet);
    display: block;
    margin-bottom: 12px;
  }
  .page-header h1 { font-size: clamp(1.8rem, 5vw, 2.5rem); margin-bottom: 8px; }
  .page-header p { color: var(--grey); font-size: 0.92rem; }

  .progress-wrap { max-width: 420px; margin: 22px auto 0; }
  .progress-label {
    display: flex; justify-content: space-between;
    font-size: 0.78rem; color: var(--grey); margin-bottom: 6px;
  }
  .progress-track { height: 10px; border-radius: 999px; background: var(--mist); overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(100deg, var(--violet-deep), var(--violet)); border-radius: 999px; transition: width 0.5s ease; }

  .view-toggle {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 26px auto 22px;
  }
  .view-toggle button {
    padding: 10px 20px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--white);
    color: var(--grey);
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 600;
    font-size: 0.88rem;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .view-toggle button.active { background: var(--violet-deep); color: #fff; border-color: var(--violet-deep); }
  .view-toggle button:hover:not(.active) { border-color: var(--violet); color: var(--violet-deep); }

  .view-panel { max-width: 1000px; margin: 0 auto; }
  .view-panel[hidden] { display: none; }

  /* ---------- CARTE ---------- */
  #leaflet-map {
    width: 100%;
    height: min(64vh, 560px);
    border-radius: 24px;
    border: 1px solid var(--line);
    z-index: 1;
  }
  .map-legend {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin-top: 14px;
    font-size: 0.78rem;
    color: var(--grey);
  }
  .map-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .legend-dot.visited { background: var(--violet-deep); }
  .legend-dot.unvisited { background: var(--locked); }
  .legend-dot.me { background: #2F6FE0; }

  .locate-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .locate-btn {
    padding: 9px 18px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--white);
    color: var(--violet-deep);
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 600;
    font-size: 0.82rem;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .locate-btn:hover { background: var(--mist); border-color: var(--lilac-deep); }
  .locate-status { font-size: 0.78rem; color: var(--grey); }

  .user-dot { position: relative; width: 20px; height: 20px; }
  .user-dot .dot-pulse {
    position: absolute; inset: -10px;
    border-radius: 50%;
    background: rgba(47,111,224,0.35);
    animation: user-pulse 1.8s ease-out infinite;
  }
  .user-dot .dot-core {
    position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #2F6FE0;
    border: 3px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.35);
  }
  @keyframes user-pulse {
    0% { transform: scale(0.4); opacity: 0.7; }
    100% { transform: scale(1.8); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .user-dot .dot-pulse { animation: none; opacity: 0.35; }
  }

  .leaflet-popup-content { font-family: 'Inter', sans-serif; text-align: center; min-width: 160px; }
  .popup-name { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; margin-bottom: 8px; }
  .popup-btn {
    display: inline-block;
    margin-top: 4px;
    padding: 7px 14px;
    border-radius: 999px;
    border: none;
    background: var(--violet-deep);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  .popup-status { font-size: 0.75rem; color: var(--violet-deep); margin-top: 6px; }

  /* ---------- COLLECTION (POKÉDEX) ---------- */
  .collection-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
  }
  .poke-card {
    aspect-ratio: 1/1.15;
    border-radius: 18px;
    border: 1px solid var(--line);
    background: var(--mist);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    overflow: hidden;
    position: relative;
  }
  .poke-card:hover { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(91,63,160,0.14); }

  .poke-card.locked { color: var(--locked); }
  .poke-card.locked .poke-icon { opacity: 0.5; filter: grayscale(1); }
  .poke-card.locked .poke-name { color: var(--grey); font-size: 0.72rem; }

  .poke-card.unlocked {
    background: var(--white);
    border-color: var(--lilac-deep);
  }
  .poke-card .poke-photo {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .poke-card .poke-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(0deg, rgba(23,21,28,0.75), transparent 55%);
    display: flex;
    align-items: flex-end;
    padding: 8px;
  }
  .poke-card .poke-overlay .poke-name { color: #fff; font-size: 0.72rem; font-weight: 600; }

  .poke-icon { font-size: 1.8rem; margin-bottom: 6px; }
  .poke-name { font-size: 0.74rem; font-weight: 500; line-height: 1.25; }

  .collection-empty-note {
    text-align: center;
    color: var(--grey);
    font-size: 0.85rem;
    margin-top: 20px;
  }

  /* ---------- MODALE (visite / preuve photo) ---------- */
  .place-modal {
    position: fixed; inset: 0; z-index: 600;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .place-modal[hidden] { display: none; }
  .place-modal-backdrop { position: absolute; inset: 0; background: rgba(23,21,28,0.5); backdrop-filter: blur(4px); }
  .place-modal-panel {
    position: relative; z-index: 1;
    width: 100%; max-width: 420px;
    background: var(--white);
    border-radius: 26px;
    padding: 28px;
    box-shadow: 0 30px 70px rgba(23,21,28,0.25);
    text-align: center;
  }
  .place-modal-close {
    position: absolute; top: 14px; right: 14px;
    width: 30px; height: 30px; border-radius: 50%;
    border: none; background: var(--mist); color: var(--grey);
    font-size: 1rem; cursor: pointer;
  }
  .place-modal-cat { font-size: 1.6rem; margin-bottom: 6px; }
  .place-modal-name { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 1.2rem; margin-bottom: 4px; }
  .place-modal-sub { font-size: 0.82rem; color: var(--grey); margin-bottom: 18px; }
  .place-modal-photo { width: 100%; border-radius: 16px; margin-bottom: 14px; display: block; }

  .place-modal input[type="file"] { display: none; }
  .place-upload-label {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%;
    padding: 14px;
    border-radius: 16px;
    border: 1.5px dashed var(--lilac-deep);
    background: var(--mist);
    color: var(--violet-deep);
    font-weight: 600; font-size: 0.9rem;
    cursor: pointer;
    margin-bottom: 14px;
  }
  .place-upload-label:hover { background: var(--lilac); }

  .place-modal-save {
    width: 100%;
    padding: 13px;
    border-radius: 999px;
    border: none;
    background: var(--violet-deep);
    color: #fff;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.3s ease;
  }
  .place-modal-save:hover { background: var(--violet); }
  .place-modal-save:disabled { opacity: 0.55; cursor: default; }
  .place-modal-undo {
    width: 100%;
    margin-top: 10px;
    padding: 11px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--grey);
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
  }
  .place-modal-undo:hover { border-color: #D64545; color: #D64545; background: rgba(214,69,69,0.06); }
  .place-modal-status { font-size: 0.8rem; color: var(--violet-deep); margin-top: 10px; min-height: 1.2em; }
  .place-modal-date { font-size: 0.75rem; color: var(--grey); margin-top: 4px; }
</style>
</head>

  <div class="page-header">
    <span class="kicker">Chasse aux lieux</span>

        <span id="progress-text">0 / 72 visités</span>

    </div>
  </div>

  <div class="view-toggle">
    <button type="button" id="tab-map" class="active">🗺️ Carte</button>
    <button type="button" id="tab-collection">🎴 Collection</button>
  </div>

  <div class="view-panel" id="panel-map">

  <div class="view-panel" id="panel-collection" hidden>

  <div class="place-modal" id="place-modal" hidden>

    <div class="place-modal-panel" role="dialog" aria-modal="true">
      <button type="button" class="place-modal-close" id="place-modal-close" aria-label="Fermer">×</button>
      <div class="place-modal-cat" id="place-modal-cat"></div>
      <p class="place-modal-name" id="place-modal-name"></p>
      <p class="place-modal-sub" id="place-modal-sub"></p>

      <img class="place-modal-photo" id="place-modal-photo" hidden alt="Photo preuve de visite">

      <label class="place-upload-label" for="place-modal-input" id="place-upload-label">
        📷 <span id="place-upload-label-text">Ajouter une photo preuve</span>
      </label>
      <input type="file" id="place-modal-input" accept="image/*" capture="environment">

      <button type="button" class="place-modal-save" id="place-modal-save" disabled>Valider ce lieu</button>
      <button type="button" class="place-modal-undo" id="place-modal-undo" hidden>Annuler la visite</button>
      <p class="place-modal-status" id="place-modal-status"></p>
      <p class="place-modal-date" id="place-modal-date"></p>
    </div>
  </div>

      { id: 'mtp057', name: 'Gare Saint-Roch', cat: 'monument', lat: 43.6047981, lng: 3.8807164 },
      { id: 'mtp058', name: 'Place Saint-Roch', cat: 'rue', lat: 43.6084721, lng: 3.8757994 },
      { id: 'mtp059', name: 'Parc Montcalm', cat: 'parc', lat: 43.5967826, lng: 3.8590839 },
      { id: 'mtp060', name: 'Château de la Mogère', cat: 'chateau', lat: 43.6005458, lng: 3.9258288 },
      { id: 'mtp061', name: 'Château de Flaugergues', cat: 'chateau', lat: 43.6102392, lng: 3.9185683 },
      { id: 'mtp062', name: 'Château d\'O', cat: 'chateau', lat: 43.6332535, lng: 3.8390562 },
      { id: 'mtp063', name: 'Domaine de Grammont', cat: 'parc', lat: 43.6154413, lng: 3.9294154 },
      { id: 'mtp064', name: 'Halles Laissac', cat: 'marche', lat: 43.6060791, lng: 3.8764312 },
      { id: 'mtp065', name: 'Halles Castellane', cat: 'marche', lat: 43.6102811, lng: 3.8766547 },
      { id: 'mtp066', name: 'Pont du Diable', cat: 'excursion', lat: 43.70765, lng: 3.5573786 },
      { id: 'mtp067', name: 'Cathédrale de Maguelone', cat: 'excursion', lat: 43.5124566, lng: 3.8835185 },
      { id: 'mtp068', name: 'Presqu\'île de Maguelone', cat: 'excursion', lat: 43.515, lng: 3.895 },
      { id: 'mtp069', name: 'Plage de Palavas-les-Flots', cat: 'plage', lat: 43.5322947, lng: 3.9479766 },
      { id: 'mtp070', name: 'Plage de Carnon', cat: 'plage', lat: 43.5448367, lng: 3.9820157 },
      { id: 'mtp071', name: 'Plage de la Grande Motte', cat: 'plage', lat: 43.5574015, lng: 4.0494637 },
      { id: 'mtp072', name: 'Étang de l\'Or', cat: 'excursion', lat: 43.5791813, lng: 4.0159135 },
    ];

    const CAT_ICONS = {
      monument: '🏛️', musee: '🖼️', parc: '🌳', quartier: '🏘️',
      plage: '🏖️', chateau: '🏰', marche: '🛍️', moderne: '🌆',
      rue: '🚶', excursion: '🚗'
    };
    const CAT_LABELS = {
      monument: 'Monument', musee: 'Musée', parc: 'Parc & nature', quartier: 'Quartier',
      plage: 'Plage', chateau: 'Château', marche: 'Marché', moderne: 'Architecture moderne',
      rue: 'Rue & place', excursion: 'Excursion'
    };

    let visits = {}; // { placeId: {photoUrl, visitedAt} }
    let activePlace = null;
    let pendingPhoto = null;

    // ---------- Compression photo (léger, cohérent avec le reste du site) ----------
    function compressImage(file, maxDim = 900, quality = 0.7) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const objectUrl = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(objectUrl);
          let { width, height } = img;
          if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
          else if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = objectUrl;
      });
    }

    // ---------- Carte Leaflet ----------
    const map = L.map('leaflet-map', { scrollWheelZoom: true }).setView([43.6109, 3.8772], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    // ---------- Position en direct de l'appareil ----------
    const locateBtn = document.getElementById('locate-btn');
    const locateStatus = document.getElementById('locate-status');
    let userMarker = null;
    let userAccuracyCircle = null;
    let userLatLng = null;
    let hasCenteredOnUser = false;

    function userLocationIcon() {
      return L.divIcon({
        className: '',
        html: `<div class="user-dot"><div class="dot-pulse"></div><div class="dot-core"></div></div>`,
        iconSize: [20, 20],
        iconAnchor: [10, 10]
      });
    }

    function handlePosition(pos) {
      const { latitude, longitude, accuracy } = pos.coords;
      userLatLng = [latitude, longitude];
      if (!userMarker) {
        userMarker = L.marker(userLatLng, { icon: userLocationIcon(), zIndexOffset: 1000 }).addTo(map);
        userMarker.bindPopup('Toi, en direct 📍');
        userAccuracyCircle = L.circle(userLatLng, {
          radius: accuracy, color: '#2F6FE0', fillColor: '#2F6FE0', fillOpacity: 0.1, weight: 1
        }).addTo(map);
      } else {
        userMarker.setLatLng(userLatLng);
        userAccuracyCircle.setLatLng(userLatLng);
        userAccuracyCircle.setRadius(accuracy);
      }
      locateStatus.textContent = '';
      if (!hasCenteredOnUser) {
        hasCenteredOnUser = true;
        map.setView(userLatLng, 15);
      }
    }

    function handlePositionError(err) {
      if (err.code === err.PERMISSION_DENIED) {
        locateStatus.textContent = "Localisation refusée — active-la dans les réglages du navigateur pour te voir sur la carte.";
      } else {
        locateStatus.textContent = "Position indisponible pour le moment.";
      }
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(handlePosition, handlePositionError, {
        enableHighAccuracy: true,
        maximumAge: 5000,
        timeout: 15000
      });
    } else {
      locateStatus.textContent = "La géolocalisation n'est pas supportée par ce navigateur.";
    }

    locateBtn.addEventListener('click', () => {
      if (userLatLng) {
        map.setView(userLatLng, 16);
      } else {
        locateStatus.textContent = "Recherche de ta position…";
      }
    });

    function markerIcon(visited) {
      return L.divIcon({
        className: '',
        html: `<div style="width:16px;height:16px;border-radius:50%;background:${visited ? '#5B3FA0' : '#C9C4D6'};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.35);"></div>`,
        iconSize: [16, 16],
        iconAnchor: [8, 8]
      });
    }

    const markers = {};
    PLACES.forEach(place => {
      const marker = L.marker([place.lat, place.lng], { icon: markerIcon(false) }).addTo(map);
      marker.bindPopup(popupContent(place));
      marker.on('popupopen', () => {
        const btn = document.getElementById(`popup-btn-${place.id}`);
        if (btn) btn.addEventListener('click', () => openPlaceModal(place));
      });
      markers[place.id] = marker;
    });

    function popupContent(place) {
      const visited = !!visits[place.id];
      return `
        <div class="popup-name">${CAT_ICONS[place.cat] || '📍'} ${place.name}</div>
        ${visited
          ? `<div class="popup-status">Visité ✓</div><button class="popup-btn" id="popup-btn-${place.id}">Voir / changer la photo</button>`
          : `<button class="popup-btn" id="popup-btn-${place.id}">Marquer comme visité</button>`
        }
      `;
    }

    function refreshMarkers() {
      PLACES.forEach(place => {
        const visited = !!visits[place.id];
        markers[place.id].setIcon(markerIcon(visited));
        markers[place.id].setPopupContent(popupContent(place));
      });
    }

    // ---------- Collection (Pokédex) ----------
    const collectionGrid = document.getElementById('collection-grid');
    function renderCollection() {
      collectionGrid.innerHTML = '';
      PLACES.forEach(place => {
        const v = visits[place.id];
        const card = document.createElement('div');
        card.className = 'poke-card ' + (v ? 'unlocked' : 'locked');
        if (v) {
          card.innerHTML = `
            <img class="poke-photo" src="${v.photoUrl}" alt="${place.name}">
            <div class="poke-overlay"><span class="poke-name">${place.name}</span></div>
          `;
        } else {
          card.innerHTML = `
            <span class="poke-icon">🔒</span>
            <span class="poke-name">${place.name}</span>
          `;
        }
        card.addEventListener('click', () => openPlaceModal(place));
        collectionGrid.appendChild(card);
      });
    }

    // ---------- Progression ----------
    const progressText = document.getElementById('progress-text');
    const progressPct = document.getElementById('progress-pct');
    const progressFill = document.getElementById('progress-fill');
    function updateProgress() {
      const total = PLACES.length;
      const done = Object.keys(visits).length;
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;
      progressText.textContent = `${done} / ${total} visités`;
      progressPct.textContent = `${pct}%`;
      progressFill.style.width = `${pct}%`;
    }

    // ---------- Synchronisation Firestore en direct ----------
    onSnapshot(visitsCollection, (snapshot) => {
      visits = {};
      snapshot.forEach(d => { visits[d.id] = d.data(); });
      refreshMarkers();
      renderCollection();
      updateProgress();
    }, (err) => {
      console.error("Erreur Firestore (visites Montpellier) :", err);
    });

    // ---------- Modale lieu ----------
    const placeModal = document.getElementById('place-modal');
    const placeModalBackdrop = document.getElementById('place-modal-backdrop');
    const placeModalClose = document.getElementById('place-modal-close');
    const placeModalCat = document.getElementById('place-modal-cat');
    const placeModalName = document.getElementById('place-modal-name');
    const placeModalSub = document.getElementById('place-modal-sub');
    const placeModalPhoto = document.getElementById('place-modal-photo');
    const placeModalInput = document.getElementById('place-modal-input');
    const placeUploadLabelText = document.getElementById('place-upload-label-text');
    const placeModalSave = document.getElementById('place-modal-save');
    const placeModalUndo = document.getElementById('place-modal-undo');
    const placeModalStatus = document.getElementById('place-modal-status');
    const placeModalDate = document.getElementById('place-modal-date');

    function openPlaceModal(place) {
      activePlace = place;
      pendingPhoto = null;
      const v = visits[place.id];
      placeModalCat.textContent = CAT_ICONS[place.cat] || '📍';
      placeModalName.textContent = place.name;
      placeModalSub.textContent = CAT_LABELS[place.cat] || '';
      placeModalStatus.textContent = '';
      placeModalInput.value = '';
      placeUploadLabelText.textContent = v ? 'Remplacer la photo' : 'Ajouter une photo preuve';
      placeModalSave.disabled = true;
      placeModalSave.textContent = v ? 'Mettre à jour' : 'Valider ce lieu';
      placeModalUndo.hidden = !v;

      if (v && v.photoUrl) {
        placeModalPhoto.src = v.photoUrl;
        placeModalPhoto.hidden = false;
      } else {
        placeModalPhoto.hidden = true;
      }

      if (v && v.visitedAt && typeof v.visitedAt.toDate === 'function') {
        placeModalDate.textContent = `Visité le ${v.visitedAt.toDate().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })}`;
      } else {
        placeModalDate.textContent = '';
      }

      placeModal.hidden = false;
    }

    function closePlaceModal() {
      placeModal.hidden = true;
      activePlace = null;
      pendingPhoto = null;
    }

    placeModalClose.addEventListener('click', closePlaceModal);
    placeModalBackdrop.addEventListener('click', closePlaceModal);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !placeModal.hidden) closePlaceModal(); });

    placeModalInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      placeModalStatus.textContent = 'Préparation de la photo…';
      try {
        pendingPhoto = await compressImage(file);
        placeModalPhoto.src = pendingPhoto;
        placeModalPhoto.hidden = false;
        placeModalSave.disabled = false;
        placeModalStatus.textContent = '';
      } catch (err) {
        placeModalStatus.textContent = "Impossible de lire cette photo.";
      }
    });

    placeModalSave.addEventListener('click', async () => {
      if (!activePlace || !pendingPhoto) return;
      placeModalSave.disabled = true;
      placeModalStatus.textContent = 'Enregistrement…';
      try {
        await setDoc(doc(db, "montpellierVisits", activePlace.id), {
          photoUrl: pendingPhoto,
          placeName: activePlace.name,
          visitedAt: serverTimestamp()
        });
        placeModalStatus.textContent = 'Lieu débloqué ✓';
        setTimeout(closePlaceModal, 600);
      } catch (err) {
        placeModalStatus.textContent = "Échec — vérifie ta configuration Firebase.";
        console.error("Erreur Firestore (validation lieu) :", err);
        placeModalSave.disabled = false;
      }
    });

    placeModalUndo.addEventListener('click', async () => {
      if (!activePlace) return;
      placeModalUndo.disabled = true;
      placeModalStatus.textContent = 'Annulation…';
      try {
        await deleteDoc(doc(db, "montpellierVisits", activePlace.id));
        placeModalStatus.textContent = 'Visite annulée';
        setTimeout(closePlaceModal, 500);
      } catch (err) {
        placeModalStatus.textContent = "Échec de l'annulation — réessaie.";
        console.error("Erreur Firestore (annulation visite) :", err);
      } finally {
        placeModalUndo.disabled = false;
      }
    });

    // ---------- Bascule Carte / Collection ----------
    const tabMap = document.getElementById('tab-map');
    const tabCollection = document.getElementById('tab-collection');
    const panelMap = document.getElementById('panel-map');
    const panelCollection = document.getElementById('panel-collection');

    tabMap.addEventListener('click', () => {
      tabMap.classList.add('active');
      tabCollection.classList.remove('active');
      panelMap.hidden = false;
      panelCollection.hidden = true;
      setTimeout(() => map.invalidateSize(), 50);
    });
    tabCollection.addEventListener('click', () => {
      tabCollection.classList.add('active');
      tabMap.classList.remove('active');
      panelCollection.hidden = false;
      panelMap.hidden = true;
    });

    renderCollection();
    updateProgress();
  </script>

</body>
</html>
